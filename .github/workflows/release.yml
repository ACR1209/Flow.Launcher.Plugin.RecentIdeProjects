name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 test_main.py
      - run: zip -r RecentIdeProjects-${GITHUB_REF_NAME#v}.zip plugin.json main.py Images
      - uses: softprops/action-gh-release@v2
        with:
          files: RecentIdeProjects-*.zip
